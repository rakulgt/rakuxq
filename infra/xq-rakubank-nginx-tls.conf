limit_req_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_key:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rakuxq_trial_ip:10m rate=10r/m;
limit_conn_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_conn:10m;
log_format rakuxq_timing escape=json
    '$time_iso8601 host=$host protocol=$server_protocol method=$request_method uri=$uri status=$status '
    'request_length=$request_length response_length=$body_bytes_sent '
    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
    'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time '
    'server_timing="$upstream_http_server_timing"';

server {
    listen 80;
    listen [::]:80;
    server_name xq.rakubank.com xq-fast.rakubank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xq.rakubank.com xq-fast.rakubank.com;

    ssl_certificate /etc/letsencrypt/live/xq.rakubank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xq.rakubank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-RakuXQ-Ingress $host always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}
