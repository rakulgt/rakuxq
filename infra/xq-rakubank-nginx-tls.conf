limit_req_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_key:10m rate=30r/m;
limit_conn_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_conn:10m;

# Keep port 80 available to Cloudflare while the zone is in Flexible mode. Once
# Cloudflare uses Full (strict), requests use the TLS server below.
server {
    listen 80;
    listen [::]:80;
    server_name xq.rakubank.com;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xq.rakubank.com;

    ssl_certificate /etc/letsencrypt/live/xq.rakubank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xq.rakubank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}
