limit_req_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_key:10m rate=30r/m;
limit_conn_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name xq.rakubank.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xq.rakubank.com;

    ssl_certificate /etc/letsencrypt/live/xq.rakubank.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xq.rakubank.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}
