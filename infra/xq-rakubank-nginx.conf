limit_req_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_key:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rakuxq_trial_ip:10m rate=10r/m;
limit_conn_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name xq.rakubank.com;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}
