limit_req_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_key:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rakuxq_trial_ip:10m rate=10r/m;
limit_conn_zone "$http_authorization:$http_x_api_key:$binary_remote_addr" zone=rakuxq_api_conn:10m;
log_format rakuxq_timing escape=json
    '$time_iso8601 host=$host protocol=$server_protocol method=$request_method uri=$uri status=$status '
    'request_length=$request_length response_length=$body_bytes_sent '
    'request_time=$request_time upstream_connect_time=$upstream_connect_time '
    'upstream_header_time=$upstream_header_time upstream_response_time=$upstream_response_time '
    'server_timing="$upstream_http_server_timing"';

server {
    listen 80;
    listen [::]:80;
    server_name xq.rakubank.com vpn.xq.rakubank.com;

    include /etc/nginx/snippets/rakuxq-api-routes.conf;
}
