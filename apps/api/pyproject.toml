[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rakuxq-api"
version = "0.2.0a3"
description = "RakuXQ image-to-FEN HTTP API"
readme = "README.md"
authors = [
  { name = "Li Guotai", email = "lgt@rakubank.com" },
]
license = "MIT"
keywords = ["xiangqi", "computer-vision", "fen", "onnx", "nnue"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "onnxruntime>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/rakulgt/rakuxq"
Repository = "https://github.com/rakulgt/rakuxq"
Issues = "https://github.com/rakulgt/rakuxq/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rakuxq_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true
