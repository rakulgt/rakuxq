name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned browser dependency
        run: npm ci
      - name: Verify vendored rules engine
        run: |
          npm run vendor:xiangqi
          git diff --exit-code -- apps/api/src/rakuxq_api/static/vendor
      - name: Test interactive board rules
        run: npm run test:web
      - name: Check browser JavaScript syntax
        run: |
          node --check apps/api/src/rakuxq_api/static/app.js
          node --check apps/api/src/rakuxq_api/static/developers.js
          node --check apps/api/src/rakuxq_api/static/position-board.js

  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
